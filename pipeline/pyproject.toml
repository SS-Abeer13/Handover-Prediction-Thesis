[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoproj"
version = "0.1.0"
description = "Uncertainty-aware multi-horizon LTE handover and QoE forecasting pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3",
  "pyyaml>=6.0", "pyarrow>=12", "matplotlib>=3.7", "lightgbm>=4.0", "torch>=2.0",
]

[project.optional-dependencies]
extra = ["xgboost>=2.0", "optuna>=3.4", "onnxruntime>=1.16", "mlflow>=2.9"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
